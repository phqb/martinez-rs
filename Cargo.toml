[package]
name = "martinez-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
robust = "1.2.0"
criterion = { version = "=0.7.0", optional = true }
geojson = { version = "=0.24.2", optional = true }
cfg-if = { version = "=1.0.4", optional = true }

[dev-dependencies]
graph_safe_compare = "0.2.1"
test_each_file = "0.3.5"
criterion = { version = "=0.7.0" }
geojson = { version = "=0.24.2" }
rand = "0.9.2"

[features]
bench = ["criterion", "geojson", "cfg-if"]
bench_reuse = []
test_reuse = []
no_splay_tree = []

[[bench]]
name = "hole_hole"
harness = false

[[bench]]
name = "asia_union"
harness = false

[[bench]]
name = "states_source"
harness = false